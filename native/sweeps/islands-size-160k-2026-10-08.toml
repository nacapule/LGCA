# Island study, larger boxes, alpha 0.85 to 0.94 continued to step 160,000: L = 60 to 480
# from step 80,000, and L = 720 (alpha 0.9 and 0.94) from step 80,000 after
# islands-size-L720-2026-10-06.toml. Same settings and output as
# islands-size-2026-10-06.toml, into the same folder; run it after those two. Each job
# continues its trace from the lattice saved at its last checkpoint.
#
#   python3 native/trace_sweep.py native/sweeps/islands-size-160k-2026-10-08.toml \
#       results/islands-2026-10-06/size --processes 6
#
# Jobs that the 2026-09-30 study ran are checked against its saved runs, row for row
# (`check`); without that folder, add --no-check.

end = 160000
states = true
check = ["results/density-alpha-sweep-2026-09-30/data"]

# Up to L = 240: five seeds.
[[grid]]
sizes = [60, 90, 120, 180, 240]
alphas = [0.85, 0.88, 0.9, 0.92, 0.94]
densities = [0.4]
seeds = [12345, 777, 424242, 20260925, 314159]

# L = 360 and 480: four seeds.
[[grid]]
sizes = [360, 480]
alphas = [0.85, 0.88, 0.9, 0.92, 0.94]
densities = [0.4]
seeds = [12345, 777, 424242, 20260925]

# L = 720: four seeds.
[[grid]]
sizes = [720]
alphas = [0.9, 0.94]
densities = [0.4]
seeds = [12345, 777, 424242, 20260925]
