# Island study, larger boxes: more particles from a larger box at a fixed density, instead
# of a denser box. Settings as in the density x alpha study of 2026-09-30: boson, polar
# alignment, power kernel, field from the centre and its six neighbours, sensitivity 6;
# dens 0.4 per channel = 2.4 particles per site. Each job is traced with `lgca_native
# trace`, which measures the islands at every sample step and here also saves the lattice
# at every checkpoint (states), which build/heaviest.py of the island study reads.
#
#   python3 native/trace_sweep.py native/sweeps/islands-size-2026-10-06.toml \
#       results/islands-2026-10-06/size --processes 6
#
# Jobs that the 2026-09-30 study ran are checked against its saved runs, row for row
# (`check`); without that folder, add --no-check.

end = 80000
states = true
check = ["results/density-alpha-sweep-2026-09-30/data"]

# Up to L = 240: five seeds.
[[grid]]
sizes = [60, 90, 120, 180, 240]
alphas = [0, 0.5, 0.8, 0.85, 0.88, 0.9, 0.92, 0.94, 0.96, 1]
densities = [0.4]
seeds = [12345, 777, 424242, 20260925, 314159]

# L = 360 and 480: four seeds.
[[grid]]
sizes = [360, 480]
alphas = [0, 0.5, 0.8, 0.85, 0.88, 0.9, 0.92, 0.94, 0.96, 1]
densities = [0.4]
seeds = [12345, 777, 424242, 20260925]
