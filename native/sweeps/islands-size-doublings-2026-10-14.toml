# Island study, larger boxes, continued one doubling at a time (stage 7, after
# islands-size-320k-2026-10-09.toml, into the same folder). Each setting (box side L and
# alpha, all its seeds) went on from its end in the earlier stages, one doubling at a time,
# while it was still changing; these are the ends it reached. Same settings and output as
# islands-size-2026-10-06.toml. Each job continues its trace from the lattice saved at its
# last checkpoint.
#
#   python3 native/trace_sweep.py native/sweeps/islands-size-doublings-2026-10-14.toml \
#       results/islands-2026-10-06/size --processes 6
#
# Jobs that the 2026-09-30 study ran are checked against its saved runs, row for row
# (`check`); without that folder, add --no-check. Run in one go this stage takes roughly
# 60 processor-hours.

states = true
check = ["results/density-alpha-sweep-2026-09-30/data"]

